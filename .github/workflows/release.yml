
name: Build and Release GraalVM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: blog-app-linux
            executable: target/blog-app

          - os: ubuntu-24.04-arm
            artifact: blog-app-linux-arm64
            executable: target/blog-app

          - os: windows-latest
            artifact: blog-app-windows.exe
            executable: target/blog-app.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build native executable
        run: mvn -B clean package -Pnative

      - name: Prepare executable
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/${{ matrix.artifact }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-jar:
    name: Build Executable JAR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn -B clean package -Pjar

      - name: Prepare JAR
        run: |
          mkdir -p dist
          cp target/BlogSimples-1.jar dist/blog-app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-app-jar
          path: dist/blog-app.jar
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-native
      - build-jar
    runs-on: ubuntu-24.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/blog-app-linux
            dist/blog-app-linux-arm64
            dist/blog-app-windows.exe
            dist/blog-app.jar
